<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}InterviewPrep AI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container site-header-inner">
      <div class="brand-block">
        <span class="brand">InterviewPrep <span class="brand-accent">AI</span></span>
        <span class="brand-tagline">Resume Analysis &amp; ATS Check</span>
      </div>
      <nav class="site-nav">
        <a href="/" class="nav-link {% if active_page == 'phase1' %}nav-link-active{% endif %}">Resume Analyzer</a>
        <a href="/jd-match" class="nav-link {% if active_page == 'phase2' %}nav-link-active{% endif %}">JD Match</a>
        <button type="button" id="theme-toggle" class="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>InterviewPrep AI</span>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <script src="{{ url_for('static', filename='js/accordion.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
