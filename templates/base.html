<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}InterviewPrep AI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <span class="brand">InterviewPrep <span class="brand-accent">AI</span></span>
      <span class="brand-tagline">Resume Analysis &amp; ATS Check</span>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>InterviewPrep AI · Phase 1</span>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
